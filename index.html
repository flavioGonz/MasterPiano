    <meta name="theme-color" content="#0b0d12" />
    <!-- El tema se decide ANTES del primer pintado: si no, se ve un destello
         del tema equivocado en cada recarga. Sin preferencia guardada, manda
         el sistema operativo. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('pianomaster_theme');
          var t = saved === 'light' || saved === 'dark'
            ? saved
            : (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.setAttribute('data-theme', t);
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', t === 'light' ? '#f4f1ea' : '#0b0d12');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
